name: Publish to NuGet

on:
  push:
    tags: ['v13.*', 'v17.*', 'v18.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag and branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(13|17|18)\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Expected a version tag such as v18.0.0 or v18.0.0-rc1" >&2
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          branch="v$major/main"
          if [[ "$major" == 18 ]]; then branch=main; fi
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/$branch"
          declared=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("Directory.Build.props").findtext("PropertyGroup/UmbracoMajor"))')
          if [[ "$declared" != "$major" ]]; then
            echo "The tag major must match the checked-out branch configuration" >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "UMBRACO_MAJOR=$major" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore Umbraco.Community.SmtpOAuthMailSender.slnx --configfile NuGet.Config -p:UmbracoMajor="$UMBRACO_MAJOR"
      - name: Build including test site
        run: dotnet build Umbraco.Community.SmtpOAuthMailSender.slnx -c Release --no-restore -p:UmbracoMajor="$UMBRACO_MAJOR"
      - name: Test
        run: dotnet test Umbraco.Community.SmtpOAuthMailSender.slnx -c Release --no-build --no-restore -p:UmbracoMajor="$UMBRACO_MAJOR"
      - name: Pack
        run: dotnet pack src/Umbraco.Community.SmtpOAuthMailSender/Umbraco.Community.SmtpOAuthMailSender.csproj -c Release --no-restore -o artifacts -p:UmbracoMajor="$UMBRACO_MAJOR" -p:PackageVersion="$PACKAGE_VERSION"
      - name: Verify package
        run: python3 scripts/verify-package.py "artifacts/Umbraco.Community.SmtpOAuthMailSender.${PACKAGE_VERSION}.nupkg" "$PACKAGE_VERSION"
      - name: Log in to NuGet with GitHub OIDC
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/Umbraco.Community.SmtpOAuthMailSender.${PACKAGE_VERSION}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
